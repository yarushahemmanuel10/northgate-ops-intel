      customer_id: {description: "Canonical customer, or UNKNOWN", type: code, personal_data: false, bqs: [BQ-06, BQ-07, BQ-08]}
      match_status: {description: "auto, human_review, review or unmatched", type: code, personal_data: false, bqs: [BQ-07, BQ-14]}
      match_method: {description: "How the customer link was made", type: code, personal_data: false, bqs: [BQ-14]}
      business_line: {description: "Always BL5", type: code, personal_data: false, bqs: [BQ-07]}
      ordered_at: {description: "Order time", type: timestamp, personal_data: false, bqs: [BQ-07]}
      order_date: {description: "Order date; assigns BL5 revenue to a month", type: date, personal_data: false, bqs: [BQ-06, BQ-07, BQ-10]}
      status: {description: "placed, dispatched, delivered, cancelled or refunded", type: code, personal_data: false, bqs: [BQ-10]}
      promised_date: {description: "Promised delivery date", type: date, personal_data: false, bqs: [BQ-10]}
