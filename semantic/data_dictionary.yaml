      order_total: {description: "Order total, GBP excluding VAT; the BL5 revenue amount (metrics.yaml)", type: decimal, personal_data: false, bqs: [BQ-06, BQ-07]}
      line_count: {description: "Number of lines reported by the shop", type: integer, personal_data: false, bqs: [BQ-14]}
      revenue_treatment: {description: "include or exclude (cancelled, refunded)", type: code, personal_data: false, bqs: [BQ-06, BQ-07]}
      order_date_flag: {description: "Why order_date is unusable, if it is", type: text, personal_data: false, bqs: [BQ-14]}
      promised_date_flag: {description: "Why promised_date is unusable, if it is", type: text, personal_data: false, bqs: [BQ-10, BQ-14]}
      delivered_date_flag: {description: "Why delivered_date is empty or unusable (e.g. MISSING-002 delivered with no date)", type: text, personal_data: false, bqs: [BQ-10, BQ-14]}
      order_total_flag: {description: "Why order_total is unusable or inconsistent (ARITH-001: lines don't add up; value kept)", type: text, personal_data: false, bqs: [BQ-07, BQ-14]}

  fact_order_line:
    layer: warehouse
    grain: one row per line of an order in fact_order
    lineage: []
    columns:
      order_id: {description: "Order ID (joins to fact_order)", type: code, personal_data: false, bqs: [BQ-07]}
      line_no: {description: "Line number within the order", type: integer, personal_data: false, bqs: [BQ-14]}
      customer_id: {description: "Canonical customer of the order, or UNKNOWN", type: code, personal_data: false, bqs: [BQ-08]}
      match_status: {description: "Match status of the order", type: code, personal_data: false, bqs: [BQ-14]}
      business_line: {description: "Always BL5", type: code, personal_data: false, bqs: [BQ-07]}
      order_date: {description: "Order date", type: date, personal_data: false, bqs: [BQ-07]}
      revenue_treatment: {description: "Revenue treatment of the order", type: code, personal_data: false, bqs: [BQ-07]}
      sku: {description: "Product code", type: code, personal_data: false, bqs: [], unused_reason: "product-level questions are out of scope (docs/03 §2)"}
      product: {description: "Product name", type: text, personal_data: false, bqs: [], unused_reason: "product-level questions are out of scope (docs/03 §2)"}
      quantity: {description: "Quantity; empty when not positive (QTY-001)", type: integer, personal_data: false, bqs: [BQ-14]}
      unit_price: {description: "Unit price, GBP excluding VAT", type: decimal, personal_data: false, bqs: [BQ-14]}
      line_total: {description: "Line total, GBP excluding VAT (not the revenue amount: use fact_order.order_total)", type: decimal, personal_data: false, bqs: [BQ-14]}
      quantity_flag: {description: "Why quantity is empty", type: text, personal_data: false, bqs: [BQ-14]}
      unit_price_flag: {description: "Why unit_price is unusable, if it is", type: text, personal_data: false, bqs: [BQ-14]}
      line_total_flag: {description: "Why line_total is inconsistent (ARITH-002; value kept)", type: text, personal_data: false, bqs: [BQ-14]}

