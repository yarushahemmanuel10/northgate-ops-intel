      match_status: {description: "auto, human_review, review or unmatched", type: code, personal_data: false, bqs: [BQ-07, BQ-14]}
      match_method: {description: "How the customer link was made", type: code, personal_data: false, bqs: [BQ-14]}
      business_line: {description: "Always BL2", type: code, personal_data: false, bqs: [BQ-07]}
