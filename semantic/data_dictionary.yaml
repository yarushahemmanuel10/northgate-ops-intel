      bill_date_flag: {description: "Why bill_date is unusable, if it is", type: text, personal_data: false, bqs: [BQ-14]}
      line_rental_flag: {description: "Why line_rental is unusable, if it is", type: text, personal_data: false, bqs: [BQ-14]}
      call_charges_flag: {description: "Why call_charges is unusable, if it is", type: text, personal_data: false, bqs: [BQ-14]}
      total_flag: {description: "Why total is unusable or inconsistent (ARITH-003; value kept)", type: text, personal_data: false, bqs: [BQ-07, BQ-14]}

  fact_contract_line:
    layer: warehouse
    grain: one row per CRM contract line (one business line sold to one customer)
