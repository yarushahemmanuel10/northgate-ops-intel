      annual_value_flag: {description: "Why annual_value is unusable, if it is", type: text, personal_data: false, bqs: [BQ-14]}
      contract_start_flag: {description: "Why contract_start is unusable, if it is", type: text, personal_data: false, bqs: [BQ-14]}
      renewal_date_flag: {description: "Why renewal_date is empty (e.g. MISSING-003)", type: text, personal_data: false, bqs: [BQ-05, BQ-14]}
      end_date_flag: {description: "Why end_date is unusable, if it is", type: text, personal_data: false, bqs: [BQ-14]}

  # ---- revenue views (step 3.4, D-026) --------------------------------------------------------
  v_window_month:
    layer: warehouse
    grain: one row per month of the data window (April 2025 - September 2026)
    lineage: []
    columns:
      month: {description: "First day of the month", type: date, personal_data: false, bqs: [BQ-07]}

  v_contract_revenue_month:
    layer: warehouse
    grain: one row per modelled contract line (BL1, BL3, BL4) per active month of the data window
    lineage: []
    columns:
      line_id: {description: "Contract line", type: code, personal_data: false, bqs: [BQ-07, BQ-14]}
      customer_id: {description: "Canonical customer", type: code, personal_data: false, bqs: [BQ-07]}
      business_line: {description: "BL1, BL3 or BL4", type: code, personal_data: false, bqs: [BQ-07]}
      month: {description: "Active month (overlaps any part of the month, D-026)", type: date, personal_data: false, bqs: [BQ-07]}
      revenue: {description: "Annual value / 12, GBP excluding VAT (modelled)", type: decimal, personal_data: false, bqs: [BQ-07]}

  v_revenue:
    layer: warehouse
    grain: one row per customer, business line and month with revenue (Unknown customer included)
    lineage: []
    columns:
      customer_id: {description: "Canonical customer, or UNKNOWN for queued and unmatched records", type: code, personal_data: false, bqs: [BQ-06, BQ-07, BQ-08]}
      business_line: {description: "BL1-BL5", type: code, personal_data: false, bqs: [BQ-07, BQ-08]}
      month: {description: "First day of the month the revenue belongs to", type: date, personal_data: false, bqs: [BQ-06, BQ-07]}
      year_month: {description: "YYYY-MM", type: code, personal_data: false, bqs: [BQ-07, BQ-15]}
      revenue: {description: "Revenue, GBP excluding VAT, as defined in metrics.yaml revenue_by_line (unrounded)", type: decimal, personal_data: false, bqs: [BQ-06, BQ-07, BQ-08, BQ-15]}
      revenue_basis: {description: "'modelled' (BL1, BL3, BL4: from contract values) or 'measured' (BL2 bills, BL5 orders)", type: code, personal_data: false, bqs: [BQ-07]}
      records: {description: "Source records behind the figure (contract-line months, bills or orders)", type: integer, personal_data: false, bqs: [BQ-08, BQ-14]}

  v_revenue_excluded:
    layer: warehouse
    grain: one row per business line and reason where revenue records are left out because a value was flagged unusable (empty when none)
    lineage: []
    columns:
      business_line: {description: "Business line affected", type: code, personal_data: false, bqs: [BQ-07, BQ-14]}
      reason: {description: "Which value is unusable", type: text, personal_data: false, bqs: [BQ-14]}
      records: {description: "Number of records left out", type: integer, personal_data: false, bqs: [BQ-14]}

  # ---- at-risk view (step 4.1, D-028) ----------------------------------------------------------
  v_at_risk:
    layer: warehouse
    grain: one row per canonical customer (Unknown left out), with the BQ-06 signals for the last vs previous quarter
    lineage: []
    columns:
      customer_id: {description: "Canonical customer", type: code, personal_data: false, bqs: [BQ-06]}
      company_name: {description: "Business name", type: text, personal_data: false, personal_data_note: "business name", bqs: [BQ-06]}
      status: {description: "'active' or 'closed'; only active customers can be at risk", type: code, personal_data: false, bqs: [BQ-06]}
      tickets_prev: {description: "Tickets opened April-June 2026", type: integer, personal_data: false, bqs: [BQ-06]}
      tickets_last: {description: "Tickets opened July-September 2026", type: integer, personal_data: false, bqs: [BQ-06]}
      ticket_ratio: {description: "tickets_last / tickets_prev; empty when tickets_prev is 0", type: decimal, personal_data: false, bqs: [BQ-06]}
      ticket_rise: {description: "Signal: last >= 2.0 x previous and last >= 8 (config/at_risk.yaml)", type: boolean, personal_data: false, bqs: [BQ-06]}
      bl2_prev: {description: "BL2 bills April-June 2026, net of credit notes", type: decimal, personal_data: false, bqs: [BQ-06]}
      bl2_last: {description: "BL2 bills July-September 2026, net of credit notes", type: decimal, personal_data: false, bqs: [BQ-06]}
      bl2_ratio: {description: "bl2_last / bl2_prev; empty when bl2_prev is 0", type: decimal, personal_data: false, bqs: [BQ-06]}
      bl2_fall: {description: "Signal: bl2_prev > 0 and bl2_last <= 0.85 x bl2_prev", type: boolean, personal_data: false, bqs: [BQ-06]}
      shop_prev: {description: "Included shop orders April-June 2026, all the customer's shop accounts", type: decimal, personal_data: false, bqs: [BQ-06]}
      shop_last: {description: "Included shop orders July-September 2026", type: decimal, personal_data: false, bqs: [BQ-06]}
      shop_ratio: {description: "shop_last / shop_prev; empty when shop_prev is 0", type: decimal, personal_data: false, bqs: [BQ-06]}
      shop_fall: {description: "Signal: shop_prev > 0 and shop_last <= 0.4 x shop_prev", type: boolean, personal_data: false, bqs: [BQ-06]}
      at_risk_score: {description: "Number of signals fired, 0-3", type: integer, personal_data: false, bqs: [BQ-06]}
      signals_fired: {description: "The signals that fired, in words", type: text, personal_data: false, bqs: [BQ-06]}
      at_risk: {description: "Active AND tickets rising AND (BL2 or shop spend falling), D-013", type: boolean, personal_data: false, bqs: [BQ-06]}
      annual_contract_value: {description: "Annual value of contract lines still running at the as-of date", type: decimal, personal_data: false, bqs: [BQ-05, BQ-06]}
      retention_rank: {description: "Order for retention effort: at risk first, then score, then annual contract value", type: integer, personal_data: false, bqs: [BQ-06]}

  # ---- review sheet (step 4.2, D-029) ----------------------------------------------------------
  review_sheet:
    layer: warehouse
