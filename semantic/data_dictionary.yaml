      first_responded_at_flag: {description: "Why first_responded_at is unusable or inconsistent (e.g. TIME-002 before opened)", type: text, personal_data: false, bqs: [BQ-01, BQ-14]}
      closed_at_flag: {description: "Why closed_at is unusable or inconsistent (e.g. TIME-001 closed before opened; value kept)", type: text, personal_data: false, bqs: [BQ-01, BQ-03, BQ-14]}
      priority_flag: {description: "Why the priority is empty (PRIORITY-002)", type: text, personal_data: false, bqs: [BQ-01, BQ-14]}
      category_flag: {description: "Why the category is empty (CATEGORY-001)", type: text, personal_data: false, bqs: [BQ-03, BQ-14]}
      response_sla_flag: {description: "Why response SLA can't be measured: still open, closed with no first response, or invalid time", type: text, personal_data: false, bqs: [BQ-01, BQ-14]}

  ticket_text:
