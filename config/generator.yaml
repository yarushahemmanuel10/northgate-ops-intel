# Synthetic data generator settings for Northgate IT Services Ltd (fictional).
# Every value here must agree with docs/01_business_processes.md (fact sheet).
# tests/test_config.py checks the overlapping values automatically.

seed: 20261012

window:
  start: 2025-04-01
  end: 2026-09-30

# Data treated as extracted at the end of this date (D-002).
as_of_date: 2026-09-30

volumes:
  customers: 120
  new_customers_in_window: 15     # first contract starts inside the window
  closed_customers: 5             # CRM status "closed" during the window
  tickets: 1500
  open_tickets_at_as_of: 40       # closed_at empty at the as-of moment
  orders: 3000
  kb_articles: 44
  kb_policies: 6                  # SLA and service policies; articles + policies = 50
  kb_near_duplicate_pairs: 4
  kb_superseded: 1

# Share of customers taking each business line (BL5 = has ordered from the shop).
business_line_uptake:
  BL1: 0.85
  BL2: 0.50
  BL3: 0.35
  BL4: 0.15
  BL5: 0.80

# Targets for the generated revenue mix (fact sheet §1.2). Not measured figures.
revenue_share_targets:
  BL1: 0.35
  BL2: 0.25
  BL3: 0.15
  BL4: 0.10
  BL5: 0.15

customers:
  # Distinct companies with confusingly similar names (not duplicates: different
  # companies, different ACC- IDs). Tests entity resolution's false-match risk.
  lookalike_company_pairs: 4
  account_managers: [Priya Lawson, Gareth Milburn, Joanne Hesketh]   # fictional
  sector_weights:
    logistics: 0.16
    manufacturing: 0.18
    professional services: 0.18
    education: 0.08
    healthcare: 0.10
    retail: 0.12
    charities: 0.08
    construction: 0.10
  # First contract start for customers that predate the data window.
  established_start_range: [2019-01-01, 2025-03-31]
  # First contract start for new customers (inside the window).
  new_start_range: [2025-05-01, 2026-09-15]
  # Closure dates for closed customers (inside the window, leaving time for activity first).
  closed_date_range: [2025-07-01, 2026-08-31]
  # Months after a customer's first start at which an additional business line may begin.
  additional_line_offset_months: [0, 36]
  # Names containing any of these (case-insensitive) are rejected. A small guard, not a
  # check against real company registers (D-006).
  name_blocklist: [Northgate, Unity, University, Council, NHS, Police, Fire Service,
                   Greggs, Nissan, Sage, Vertu, Hitachi]

# Annual values in GBP, drawn uniformly and rounded to the nearest 100. Ranges were
# calibrated on the average of seeds 1-50 (not on the project seed), so the expected
# revenue mix lands near revenue_share_targets on average (D-007).
# Reproduce with: python -m generator.customers --calibrate 1 50
contract_values:
  annual_value_range:
    BL1: [5300, 17900]
    BL2: [7200, 23700]     # CRM value; BL2 revenue itself comes from billing (D-003)
    BL3: [5700, 20800]
    BL4: [9200, 31600]
  # BL5 has no contract line. Each shop customer gets an annual spend budget that the
  # shop generator realises as orders.
  shop_annual_budget_range: [1600, 9100]
  term_years_weights: {1: 0.5, 2: 0.3, 3: 0.2}

tickets:
  priority_mix: {P1: 0.04, P2: 0.16, P3: 0.50, P4: 0.30}
  # SLA targets in elapsed hours (fact sheet §1.3, D-001).
  sla_hours:
    P1: {response: 1, resolution: 4}
    P2: {response: 2, resolution: 8}
    P3: {response: 4, resolution: 24}
    P4: {response: 8, resolution: 72}
  # Target share of closed tickets that breach each SLA.
  resolution_breach_rate: {P1: 0.10, P2: 0.12, P3: 0.15, P4: 0.08}
  response_breach_rate: 0.06
  kb_link_rate: 0.45              # share of tickets where an article was actually used
  # Service desk agents (fact sheet §1.4: team lead + 6 agents). Fictional. Their surnames
  # are reserved: never used in customer names or (later) customer contact names.
  agents: [Kieran Ashworth, Megan Thirlwell, Tomasz Oduya, Hannah Brierley,
           Liam Castellano, Sophie Rennard, Dan Pickering]
  # Share of tickets opened Mon-Fri within working hours (start hour, end hour).
  working_hours_share: 0.85
  working_hours: [8, 18]
  # Ticket rate varies between customers: gamma-distributed with this shape
  # (higher = more alike). Mean rate is set so the total is about volumes.tickets.
  customer_rate_shape: 8.0
  # Category weights. Categories and their topics must match generator/ticket_text.py
  # and, from step 1.8, the knowledge base topics.
  category_weights:
    Email: 0.18
    Accounts & Access: 0.16
    Hardware: 0.15
    Printing: 0.10
    Network: 0.13
    Software: 0.14
    Security: 0.07
    Backup & Restore: 0.07
  # At-risk ticket rise (BQ-06): Jul-Sep 2026 tickets at least `ratio` x Apr-Jun 2026 and
  # at least `min_last_quarter`. At-risk customers are generated to meet it. Values chosen
  # so few healthy customers meet it by chance (D-011).
  at_risk_rise:
    ratio: 2.0
    min_last_quarter: 8
    previous_quarter_range: [2, 4]     # Apr-Jun tickets for at-risk customers
    extra_last_quarter_range: [0, 3]   # added on top of the minimum that meets the rule

telecoms:
  # All money amounts in the project exclude VAT (D-012). A BL2 contract's annual value is
  # split into a fixed monthly line rental and variable call charges.
  call_charge_share: 0.35
  # Monthly call charges ~ gamma(shape, mean / shape): never negative; higher = steadier.
  call_charge_shape: 20
  service_types: [Business broadband, Leased line, Hosted VoIP, Broadband and VoIP]
  first_account_number: 50001
  # At-risk spend fall (BQ-06): Jul-Sep 2026 bill total at most `max_ratio` x Apr-Jun 2026.
  # At-risk BL2 customers' call charges fall by a fraction in this range from July 2026.
  at_risk_fall:
    max_ratio: 0.85
    call_reduction_range: [0.55, 0.75]

shop:
  first_customer_id: 1001
  # Customers with a second shop account (QI-04 structure; names clean until step 1.9).
  second_accounts: 8
  # Healthy customers who move most ordering to their second account from July 2026:
  # per account this looks like a spend fall, combined it is not (Phase 2 trap, D-013).
  account_switchers: 1
  switch_share_after: 1.0         # share of a switcher's orders on the second account from July 2026
  second_account_share: 0.30      # share of orders on the second account otherwise
  lines_per_order: [1, 2]
  promised_days: [2, 7]           # promised delivery, days after the order
  delivery_days: [1, 9]           # actual delivery, days after the order
  # Generic products only (D-006). Prices exclude VAT (D-012). weight = how often chosen.
  catalogue:
    - {sku: CAB-HDMI-2M, name: HDMI cable 2 m,                 unit_price: 7.50,  max_qty: 5, weight: 8}
    - {sku: CAB-USBC-1M, name: USB-C charging cable 1 m,       unit_price: 9.00,  max_qty: 5, weight: 8}
    - {sku: MSE-WL,      name: Wireless mouse,                 unit_price: 14.00, max_qty: 4,  weight: 9}
    - {sku: KBD-SET,     name: Wireless keyboard and mouse set, unit_price: 32.00, max_qty: 3,  weight: 8}
    - {sku: HDS-USB,     name: USB headset with microphone,    unit_price: 38.00, max_qty: 3,  weight: 7}
    - {sku: CAM-HD,      name: HD webcam,                      unit_price: 45.00, max_qty: 2,  weight: 5}
    - {sku: TNR-BLK,     name: Black toner cartridge,          unit_price: 68.00, max_qty: 3,  weight: 8}
    - {sku: SSD-1TB,     name: 1 TB internal SSD,              unit_price: 72.00, max_qty: 2,  weight: 4}
    - {sku: SW-8P,       name: 8-port network switch,          unit_price: 95.00, max_qty: 1,  weight: 3}
    - {sku: MON-24,      name: 24-inch monitor,                unit_price: 139.00, max_qty: 2, weight: 9}
    - {sku: AP-WIFI6,    name: Wi-Fi 6 access point,           unit_price: 155.00, max_qty: 2, weight: 3}
    - {sku: DOC-USBC,    name: USB-C docking station,          unit_price: 165.00, max_qty: 2, weight: 5}
    - {sku: UPS-1K,      name: 1 kVA UPS,                      unit_price: 185.00, max_qty: 1, weight: 2}
    - {sku: PRN-MONO,    name: Mono laser printer,             unit_price: 210.00, max_qty: 1, weight: 2}
    - {sku: MON-27,      name: 27-inch monitor,                unit_price: 215.00, max_qty: 2, weight: 4}
    - {sku: DSK-SFF,     name: Small form factor desktop PC,   unit_price: 610.00, max_qty: 1, weight: 2}
    - {sku: LAP-14,      name: 14-inch business laptop,        unit_price: 720.00, max_qty: 1, weight: 3}
    - {sku: LAP-15,      name: 15-inch business laptop,        unit_price: 790.00, max_qty: 1, weight: 2}
  # At-risk spend fall (BQ-06), measured on combined spend across all a customer's shop
  # accounts: Jul-Sep 2026 orders at most `max_ratio` x Apr-Jun 2026.
  at_risk_fall:
    max_ratio: 0.4
    order_reduction_range: [0.75, 0.95]  # share of at-risk orders removed from July 2026

knowledge_base:
  directory: knowledge_base
  # When a ticket used an article, which article is linked: articles written for one topic
  # are chosen more often than general guides that list several topics.
  specific_article_weight: 3
  general_guide_weight: 1

# Customers given a deliberate "rising tickets, falling spend" pattern
# (last 3 months vs previous 3 months, D-002). Ground truth for BQ-06.
at_risk_customers: 10

# Deliberate quality problems (docs/02_as_is_architecture.md §1.7).
# Rates are shares of records; counts are numbers of instances.
quality_issues:
  QI-01_name_variants:            # share of records not using the CRM spelling
    helpdesk: 0.60
    shop: 0.50
    # The billing system writes every name in its own style (upper case, no legal suffix,
    # cut to 20 characters), so 100% of telecoms names already differ from the CRM in the
    # clean data. This rate is only for extra human variants (typos, abbreviations) that
    # step 1.9 applies before the system style (D-012).
    telecoms_extra: 0.15
    variant_weights: {abbreviation: 0.25, lowercase: 0.20, drop_suffix: 0.25, typo: 0.20, uppercase_truncate: 0.10}
    # Human variants applied before the billing system's own style.
    telecoms_variant_kinds: [abbreviation, typo]
    # Shop names are set once per shop account at sign-up, so the shop rate applies to
    # shop accounts, not orders. Every second shop account gets a variant name.
  QI-02_no_shared_id: true        # structural: each system issues its own IDs
  QI-03_mixed_dates:              # share of date values not in ISO format
    crm: 0.30
    telecoms_bill_month: 0.25
    helpdesk: 0.05
    ambiguous_day_month_share: 0.30   # expected share of non-ISO dates with day <= 12 (reported, not forced)
    # One documented convention per source, so non-ISO dates can be parsed by rule (02 §1.7):
    # CRM: UK day-first, as dd/mm/yyyy or "d Mon yyyy"; helpdesk: dd/mm/yyyy HH:MM;
    # telecoms bill month: Mon-yy or mm/yyyy.
  QI-04_duplicates:
    crm_duplicate_accounts: 4     # count
    shop_duplicate_accounts: 8    # count of customers with a second shop account
    shop_duplicate_order_rate: 0.01
    telecoms_duplicate_bill_rate: 0.005
    crm_duplicate_name_kinds: [lowercase, drop_suffix, typo]   # how the re-added account was typed
    duplicate_order_delay_minutes: [1, 5]
  QI-05_invalid_values:
    ticket_closed_before_opened_rate: 0.005
    ticket_invalid_priority_rate: 0.003
    order_nonpositive_quantity_rate: 0.003
    crm_contract_value_nonstandard_rate: 0.40   # "£12,000", "12k" etc.
    invalid_priority_values: [P5, Urgent, N/A]
    nonpositive_quantities: [0, -1]
  QI-06_category_variants_rate: 0.30
  QI-06_category_variants:         # how agents type each canonical category
    Email: [email, E-mail, Outlook, Mail]
    Accounts & Access: [Accounts, Access, Account/Access, Passwords]
    Hardware: [hardware, H/W, Hardware fault]
    Printing: [Printer, Printers, printing]
    Network: [Networking, Wi-Fi/Network, network]
    Software: [software, Applications, Apps]
    Security: [security, Cyber, Virus]
    Backup & Restore: [Backup, Backups, Restore]
  QI-07_pii_in_ticket_text_rate: 0.25
  QI-08_missing_values:
    crm_renewal_date_rate: 0.05
    shop_delivered_date_rate: 0.03
    ticket_first_responded_at_rate: 0.04
    ticket_kb_link_missing_when_used_rate: 0.40
  QI-09_tickets_linking_superseded_article: 15  # count
  QI-10_negative_or_excluded_amounts:
    order_cancelled_rate: 0.04
    order_refunded_rate: 0.02
    telecoms_credit_note_rate: 0.01
  QI-11_crm_telecoms_mismatch:
    bl2_line_without_telecoms_account: 3        # count
    telecoms_account_without_bl2_line: 2        # count
    end_date_mismatch_over_30_days: 5           # count (BQ-13 list a)
